<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Smart Campus login page preview</title>
  <desc id="desc">A Smart Campus login workspace preview with green welcome panel and white dashboard login form.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1200" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7fbfa"/>
      <stop offset="0.5" stop-color="#f6f3ee"/>
      <stop offset="1" stop-color="#eef7f3"/>
    </linearGradient>
    <linearGradient id="greenPanel" x1="170" y1="80" x2="540" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c3524"/>
      <stop offset="0.55" stop-color="#155533"/>
      <stop offset="1" stop-color="#1f6b43"/>
    </linearGradient>
    <linearGradient id="button" x1="610" y1="420" x2="1070" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#db8500"/>
      <stop offset="1" stop-color="#bd4e00"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="fieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#page)"/>
  <circle cx="94" cy="632" r="20" fill="#111827" opacity="0.86"/>
  <text x="87" y="640" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">N</text>

  <rect x="98" y="78" width="470" height="542" rx="24" fill="url(#greenPanel)" filter="url(#softShadow)"/>
  <rect x="138" y="110" width="125" height="26" rx="13" fill="#f1f5f9" opacity="0.76"/>
  <text x="154" y="128" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="7" fill="#374151">WELCOME BACK</text>

  <text x="138" y="186" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff">Sign in to your Smart</text>
  <text x="138" y="236" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff">Campus workspace.</text>
  <text x="138" y="294" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#dbe7df">Access operational dashboards, resource tools, and ticket management</text>
  <text x="138" y="324" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#dbe7df">with a cleaner, role-aware entry point.</text>

  <rect x="138" y="372" width="392" height="85" rx="20" fill="#ffffff" opacity="0.14" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="158" y="406" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="7" fill="#dbe7df">ACCOUNTS</text>
  <text x="158" y="440" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff">Students, admins, and technicians</text>

  <rect x="138" y="474" width="392" height="85" rx="20" fill="#ffffff" opacity="0.14" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="158" y="508" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="7" fill="#dbe7df">ACCESS FLOW</text>
  <text x="158" y="542" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff">Email login or Google sign-in from one screen</text>

  <rect x="594" y="78" width="508" height="542" rx="28" fill="#ffffff" filter="url(#softShadow)"/>
  <rect x="620" y="110" width="72" height="28" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="639" y="129" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="4" fill="#111827">LOGIN</text>

  <text x="620" y="181" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="900" fill="#111111">Continue to your dashboard</text>
  <text x="620" y="221" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#666666">Use your campus email and password to enter the system.</text>

  <text x="620" y="280" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#3f3f46">Email</text>
  <rect x="620" y="295" width="454" height="47" rx="16" fill="#ffffff" stroke="#e5e7eb" filter="url(#fieldShadow)"/>

  <text x="620" y="374" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#3f3f46">Password</text>
  <rect x="620" y="389" width="454" height="47" rx="16" fill="#ffffff" stroke="#e5e7eb" filter="url(#fieldShadow)"/>

  <rect x="620" y="465" width="11" height="11" rx="2" fill="#ffffff" stroke="#9ca3af"/>
  <text x="642" y="476" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#6b7280">Remember me</text>
  <text x="980" y="476" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="end" fill="#27272a">Need an account?</text>

  <rect x="620" y="498" width="454" height="50" rx="25" fill="url(#button)" filter="url(#fieldShadow)"/>
  <text x="847" y="529" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Login</text>

  <rect x="620" y="566" width="454" height="50" rx="25" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="847" y="597" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#27272a">Continue with Google</text>

  <text x="620" y="630" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#be123c">Google sign-in is not configured on the backend.</text>
  <text x="620" y="651" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#be123c">Set the Google OAuth environment variables and restart the server.</text>
</svg>
