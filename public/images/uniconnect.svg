<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">UniConnect platform preview</title>
  <desc id="desc">A colorful UniConnect project thumbnail for the portfolio.</desc>
  <defs>
    <linearGradient id="brand" x1="120" y1="100" x2="1040" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb703"/>
      <stop offset="0.45" stop-color="#ff6b00"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="panel" x1="120" y1="80" x2="1080" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff3dd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <circle cx="940" cy="180" r="245" fill="#fff0cf"/>
  <circle cx="205" cy="600" r="180" fill="#eff6ff"/>
  <rect x="105" y="82" width="990" height="536" rx="28" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="105" y="82" width="990" height="82" rx="28" fill="#ffffff"/>
  <rect x="105" y="136" width="990" height="28" fill="#ffffff"/>
  <text x="168" y="136" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#brand)">UniConnect</text>
  <rect x="456" y="109" width="105" height="26" rx="13" fill="#fff7ed"/>
  <rect x="596" y="109" width="105" height="26" rx="13" fill="#fff7ed"/>
  <rect x="736" y="109" width="105" height="26" rx="13" fill="#fff7ed"/>
  <rect x="936" y="102" width="86" height="42" rx="12" fill="#cf5d00"/>
  <text x="957" y="129" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Sign up</text>
  <text x="168" y="249" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="7" fill="#f97316">BEST STUDENT NETWORK</text>
  <text x="168" y="333" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="74" font-weight="900" fill="#111827">Connect,</text>
  <text x="168" y="415" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="74" font-weight="900" fill="#111827">collaborate and</text>
  <text x="168" y="497" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="74" font-weight="900" fill="url(#brand)">succeed</text>
  <text x="168" y="559" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" fill="#475569">Student ecosystem for learning and campus life</text>
  <g transform="translate(768 246)">
    <circle cx="165" cy="150" r="150" fill="#ffefd0"/>
    <rect x="205" y="30" width="70" height="70" rx="12" transform="rotate(12 240 65)" fill="#3b82f6"/>
    <circle cx="45" cy="295" r="38" fill="#facc15"/>
    <rect x="82" y="132" width="210" height="160" rx="22" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/>
    <rect x="108" y="164" width="158" height="18" rx="9" fill="#fed7aa"/>
    <rect x="108" y="202" width="125" height="18" rx="9" fill="#bfdbfe"/>
    <rect x="108" y="240" width="96" height="18" rx="9" fill="#ddd6fe"/>
    <circle cx="266" cy="242" r="32" fill="#fb7185"/>
  </g>
</svg>
